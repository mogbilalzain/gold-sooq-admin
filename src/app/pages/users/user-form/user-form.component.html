<app-page-header
  [title]="translationService.t('users.editUser')"
  [subtitle]="translationService.t('users.editUserSubtitle')">
</app-page-header>

@if (errorMessage) {
  <div class="mb-4 rounded-m3-md bg-[color:var(--color-error-container)] p-3 text-m3-body-md text-[color:var(--color-on-error-container)]">
    {{ errorMessage }}
  </div>
}

@if (isLoading) {
  <app-loading-spinner />
} @else {
  <form (submit)="onSubmit(); $event.preventDefault()" 
        class="modern-card">
    <div class="space-y-6">
      <div>
        <app-input-field
          type="text"
          [label]="translationService.t('users.name')"
          [value]="fullName"
          (valueChange)="onNameChange($event)"
          [placeholder]="translationService.t('users.namePlaceholder')"
          class="block"
        />
      </div>

      <div>
        <app-input-field
          type="email"
          [label]="translationService.t('users.email')"
          [value]="email"
          (valueChange)="onEmailChange($event)"
          [placeholder]="translationService.t('users.emailPlaceholder')"
          class="block"
        />
      </div>

      <div>
        <app-input-field
          type="number"
          [label]="translationService.t('users.phoneNumber')"
          [value]="phoneNumber || ''"
          (valueChange)="onPhoneNumberChange($event)"
          [placeholder]="translationService.t('users.phoneNumber')"
          class="block"
        />
      </div>

      <div class="flex items-center gap-6">
        <app-checkbox
          [(checked)]="isActive"
          [label]="translationService.t('users.isActive')"
        />
        <app-checkbox
          [(checked)]="isVerified"
          [label]="translationService.t('users.isVerified')"
        />
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-outline-variant/60">
        <button
          type="button"
          matButton="outlined"
          (click)="onCancel()"
          class="px-6">
          {{ translationService.t('common.cancel') }}
        </button>
        <app-button
          type="submit"
          size="sm"
          [disabled]="!fullName || isSubmitting">
          @if (isSubmitting) {
            {{ translationService.t('common.saving') }}...
          } @else {
            {{ translationService.t('common.save') }}
          }
        </app-button>
      </div>
    </div>
  </form>
}
