<app-page-header
  [title]="translationService.t('posts.editPost')"
  [subtitle]="translationService.t('posts.editPostSubtitle')">
</app-page-header>

@if (errorMessage) {
  <div class="mb-4 rounded-m3-md bg-[color:var(--color-error-container)] p-3 text-m3-body-md text-[color:var(--color-on-error-container)]">
    {{ errorMessage }}
  </div>
}

@if (isLoading) {
  <app-loading-spinner />
} @else {
  <form (submit)="onSubmit(); $event.preventDefault()" 
        class="modern-card">
    <div class="space-y-6">
      <div>
        <app-input-field
          type="text"
          [label]="translationService.t('posts.title')"
          [value]="postTitle"
          (valueChange)="onTitleChange($event)"
          [placeholder]="translationService.t('posts.titlePlaceholder')"
          class="block"
        />
      </div>

      <div>
        <mat-form-field class="w-full" subscriptSizing="dynamic">
          <mat-label>{{ translationService.t('posts.detail') }}</mat-label>
          <textarea
            matInput
            [value]="postDetail"
            (input)="onDetailChange($any($event.target).value)"
            [placeholder]="translationService.t('posts.detailPlaceholder')"
            rows="5">
          </textarea>
        </mat-form-field>
      </div>

      <div>
        <app-input-field
          type="number"
          [label]="translationService.t('posts.price')"
          [value]="price || ''"
          (valueChange)="onPriceChange($event)"
          [placeholder]="translationService.t('posts.pricePlaceholder')"
          class="block"
        />
      </div>

      <div class="flex items-center gap-6">
        <app-checkbox
          [(checked)]="isActive"
          [label]="translationService.t('posts.isActive')"
        />
        <app-checkbox
          [(checked)]="isFeatured"
          [label]="translationService.t('posts.isFeatured')"
        />
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-outline-variant/60">
        <button
          type="button"
          matButton="outlined"
          (click)="onCancel()"
          class="px-6">
          {{ translationService.t('common.cancel') }}
        </button>
        <app-button
          type="submit"
          size="sm"
          [disabled]="!postTitle || !postDetail || isSubmitting">
          @if (isSubmitting) {
            {{ translationService.t('common.saving') }}...
          } @else {
            {{ translationService.t('common.save') }}
          }
        </app-button>
      </div>
    </div>
  </form>
}
