<div class="space-y-6">
  <!-- 1. Welcome banner: greeting, date, pending summary, shortcuts -->
  <app-welcome-banner [pendingTotal]="pendingTotal"></app-welcome-banner>

  <!-- 2. KPI stats with 30-day trends -->
  @if (isLoading) {
    <div class="grid grid-cols-2 gap-4 lg:grid-cols-4 md:gap-6">
      @for (i of [1, 2, 3, 4]; track i) {
        <div class="dashboard-card animate-pulse">
          <div class="h-12 w-12 rounded-m3-md bg-surface-container-high"></div>
          <div class="mt-4 space-y-2">
            <div class="h-3 w-1/2 rounded bg-surface-container-high"></div>
            <div class="h-6 w-2/3 rounded bg-surface-container-high"></div>
            <div class="h-7 w-full rounded bg-surface-container-high"></div>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="grid grid-cols-2 gap-4 lg:grid-cols-4 md:gap-6">
      <app-stats-card
        [title]="translationService.t('dashboard.totalUsers')"
        [value]="stats.totalUsers"
        [icon]="userIcon"
        [hint]="'+' + newUsers30 + ' ' + translationService.t('dashboard.last30Days')"
        [trend]="userTrend"
        trendColor="#5b8def"
      ></app-stats-card>

      <app-stats-card
        [title]="translationService.t('dashboard.totalPosts')"
        [value]="stats.totalPosts"
        [icon]="postIcon"
        iconBgClass="bg-success-50 text-success-600 dark:bg-success-500/15 dark:text-success-500"
        [hint]="'+' + newAds30 + ' ' + translationService.t('dashboard.last30Days')"
        [trend]="adTrend"
        trendColor="#12b76a"
      ></app-stats-card>

      <app-stats-card
        [title]="translationService.t('dashboard.activePosts')"
        [value]="stats.activePosts"
        [icon]="activeIcon"
        iconBgClass="bg-warning-500/10 text-warning-600 dark:bg-warning-500/15 dark:text-warning-400"
        [progress]="activePostsPercent"
        [progressLabel]="translationService.t('dashboard.activeShare')"
        trendColor="#f79009"
      ></app-stats-card>

      <app-stats-card
        [title]="translationService.t('dashboard.totalCategories')"
        [value]="stats.totalCategories"
        [icon]="categoryIcon"
      ></app-stats-card>
    </div>
  }

  <!-- 3. Work zone: ads awaiting review + unified task list -->
  <div class="grid grid-cols-12 gap-4 md:gap-6">
    <div class="col-span-12 xl:col-span-8">
      <app-pending-review
        [posts]="pendingPosts"
        [total]="pending?.ads ?? null"
        [loading]="loadingPending"
      ></app-pending-review>
    </div>
    <div class="col-span-12 xl:col-span-4">
      <app-attention-list
        [items]="attentionItems"
        [loading]="isLoading"
      ></app-attention-list>
    </div>
  </div>

  <!-- 4. Platform activity over the last 30 days -->
  <app-activity-chart class="block" [daily]="daily" [loading]="isLoading"></app-activity-chart>

  <!-- 5. Market section -->
  <section class="space-y-4">
    <div class="flex items-center justify-between gap-4">
      <div>
        <h3 class="text-m3-title-lg font-medium text-surface-on-surface">
          {{ translationService.t('dashboard.marketSection') }}
        </h3>
        <p class="text-sm text-surface-on-surface-variant mt-0.5">
          {{ translationService.t('dashboard.marketSectionHint') }}
        </p>
      </div>
      <a
        routerLink="/metals-prices"
        class="state-layer inline-flex h-10 shrink-0 items-center rounded-full px-3 text-m3-label-lg font-medium text-brand-700 dark:text-brand-300"
      >
        {{ translationService.t('dashboard.allPrices') }}
      </a>
    </div>

    <div class="grid grid-cols-12 gap-4 md:gap-6">
      <div class="col-span-12 xl:col-span-8">
        <app-gold-price-chart></app-gold-price-chart>
      </div>
      <div class="col-span-12 xl:col-span-4">
        <app-price-pulse
          [data]="metalsPricesData"
          [currency]="metalsCurrency"
        ></app-price-pulse>
      </div>
    </div>

    <app-current-prices></app-current-prices>
  </section>

  <!-- 6. Recent ads -->
  <app-recent-posts
    class="block"
    [posts]="recentPosts"
    [loading]="loadingPosts"
  ></app-recent-posts>
</div>
