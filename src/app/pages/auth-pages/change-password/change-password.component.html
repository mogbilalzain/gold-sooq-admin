<app-page-header
  [title]="translationService.t('auth.change.title')"
  [subtitle]="translationService.t('auth.change.subtitle')"
/>

<div class="modern-card max-w-xl">
  @if (errorMessage) {
    <div class="mb-4 p-3 text-sm rounded-xl status-pill-error">
      {{ errorMessage }}
    </div>
  }


  <form (submit)="onSubmit(); $event.preventDefault()" class="space-y-6">
    <!-- Current password -->
    <div>
      <app-input-field
        type="password"
        [label]="translationService.t('auth.change.currentPassword')"
        [placeholder]="translationService.t('auth.change.currentPassword')"
        [value]="currentPassword"
        (valueChange)="onCurrentChange($event)"
        [disabled]="isLoading"
      />
    </div>

    <!-- New password -->
    <div>
      <app-input-field
        type="password"
        [label]="translationService.t('auth.change.newPassword')"
        [placeholder]="translationService.t('auth.change.newPassword')"
        [value]="newPassword"
        (valueChange)="onNewChange($event)"
        [disabled]="isLoading"
        [hint]="translationService.t('auth.reset.passwordHint')"
      />
    </div>

    <!-- Confirm password -->
    <div>
      <app-input-field
        type="password"
        [label]="translationService.t('auth.change.confirmPassword')"
        [placeholder]="translationService.t('auth.change.confirmPassword')"
        [value]="confirmPassword"
        (valueChange)="onConfirmChange($event)"
        [disabled]="isLoading"
      />
    </div>

    <div class="flex justify-end">
      <app-button size="lg" (btnClick)="onSubmit()" [disabled]="isLoading">
        @if (isLoading) {
          {{ translationService.t('common.saving') }}
        } @else {
          {{ translationService.t('auth.change.submit') }}
        }
      </app-button>
    </div>
  </form>
</div>
