<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:gap-6">
  <!-- Metric Item Start -->
  <div class="modern-card !p-5 md:!p-6">
    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-brand-500/10 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300" [innerHTML]="icons.groupIcon | safeHtml">
    </div>
    <div class="mt-5 flex items-end justify-between">
      <div>
        <span class="text-sm text-[color:var(--color-on-surface-variant)]">Customers</span>
        <h4 class="mt-2 text-title-sm font-bold text-[color:var(--color-on-surface)]">3,782</h4>
      </div>
      <app-badge color="success">
        <span [innerHTML]="icons.arrowUpIcon | safeHtml"></span>
        11.01%
      </app-badge>
    </div>
  </div>
  <!-- Metric Item End -->

  <!-- Metric Item Start -->
  <div class="modern-card !p-5 md:!p-6">
    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-[color:var(--color-info-wash)] text-[color:var(--color-info-wash-text)]" [innerHTML]="icons.boxIconLine | safeHtml">
    </div>
    <div class="mt-5 flex items-end justify-between">
      <div>
        <span class="text-sm text-[color:var(--color-on-surface-variant)]">Orders</span>
        <h4 class="mt-2 text-title-sm font-bold text-[color:var(--color-on-surface)]">5,359</h4>
      </div>
      <app-badge color="error">
        <span [innerHTML]="icons.arrowDownIcon | safeHtml"></span>
        9.05%
      </app-badge>
    </div>
  </div>
  <!-- Metric Item End -->
</div>
