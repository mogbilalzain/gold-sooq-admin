<div class="rounded-m3-lg border border-outline-variant/50 bg-surface-container-lowest p-6 shadow-elevation-1 dark:border-outline-variant dark:bg-surface-container">
  @if (data && data.length > 0) {
    <div class="max-w-full overflow-x-auto custom-scrollbar">
      <div [style.height.px]="height" class="min-w-[600px] xl:min-w-full">
        <canvas
          baseChart
          [data]="chartData"
          [type]="chartTypeConfig"
          [options]="chartOptions">
        </canvas>
      </div>
    </div>
  } @else {
    <div class="flex items-center justify-center" [style.height.px]="height">
      <p class="text-[color:var(--color-on-surface-variant)]">{{ translationService.t('metals.noData') }}</p>
    </div>
  }
</div>
