<div class="relative">
  <button [matMenuTriggerFor]="userMenu" #menuTrigger="matMenuTrigger" class="ayar-user-btn" aria-label="User menu">
    <span class="relative flex-shrink-0">
      <img src="images/user/owner.png" alt="User" class="ayar-user-avatar" />
      <span class="ayar-user-dot"></span>
    </span>
    <span class="hidden md:block text-start">
      <span class="block text-sm font-medium leading-tight text-slate-900 dark:text-[color:var(--color-on-surface)]">
        {{ shortName }}
      </span>
      <span class="block text-[11px] font-medium text-slate-500 dark:text-[color:var(--color-on-surface-variant)]">
        {{ translationService.t('header.roleAdmin') }}
      </span>
    </span>
    <mat-icon class="ayar-user-chevron hidden md:block" [fontIcon]="'expand_more'"></mat-icon>
  </button>

  <mat-menu #userMenu="matMenu" class="app-user-menu" xPosition="before">
    <div class="app-menu-user-block" (click)="$event.stopPropagation()">
      <img src="images/user/owner.png" alt="User" />
      <div class="app-menu-user-meta">
        <span class="text-m3-title-sm font-medium text-[color:var(--color-on-surface)]">
          {{ fullName }}
        </span>
        <span class="text-m3-body-md text-[color:var(--color-on-surface-variant)]" dir="ltr">
          {{ phoneNumber }}
        </span>
      </div>
    </div>

    <button mat-menu-item routerLink="/profile" class="app-menu-item text-m3-label-lg font-medium">
      <mat-icon [fontIcon]="'person'"></mat-icon>
      {{ translationService.t('sidebar.profile') }}
    </button>

    <button mat-menu-item routerLink="/settings" class="app-menu-item text-m3-label-lg font-medium">
      <mat-icon [fontIcon]="'settings'"></mat-icon>
      {{ translationService.t('header.accountSettings') }}
    </button>

    <mat-divider></mat-divider>

    <button
      mat-menu-item
      (click)="onSignOut()"
      class="app-menu-item app-menu-item-danger text-m3-label-lg font-medium"
    >
      <mat-icon [fontIcon]="'logout'"></mat-icon>
      {{ translationService.t('auth.signOut') }}
    </button>
  </mat-menu>
</div>
