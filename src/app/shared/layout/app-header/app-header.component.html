<header
  [ngStyle]="{
    'direction': translationService.isRTL ? 'ltr' : null
  }"
  class="header-modern sticky top-0 flex w-full z-99999 border-b transition-all duration-300">
  <div class="flex flex-col items-center justify-between grow w-full xl:flex-row xl:px-4 2xl:px-6"
       [ngClass]="{
         'xl:flex-row-reverse': translationService.isRTL
       }">
    <div
      class="flex items-center justify-between w-full gap-2 px-2 py-2.5 border-b border-gray-200/50 dark:border-gray-800/50 sm:gap-3 sm:px-3 sm:py-3 md:gap-4 md:px-4 lg:py-3.5 xl:justify-normal xl:border-b-0 xl:px-0 xl:py-4"
      [ngClass]="{
        'flex-row-reverse': translationService.isRTL
      }">
      <button
        class="modern-button modern-button-secondary items-center justify-center w-9 h-9 text-gray-600 border-gray-200 rounded-lg z-99999 dark:border-gray-800 flex dark:text-gray-400 sm:w-10 sm:h-10 sm:rounded-xl md:w-11 md:h-11 lg:rounded-xl xl:border transition-all duration-300 hover:scale-105 hover:shadow-theme-sm active:scale-95"
        [ngClass]="{
          'bg-brand-50 border-brand-300 text-brand-600 dark:bg-brand-900/20 dark:border-brand-700 dark:text-brand-400': isMobileOpen$ | async
        }"
        (click)="handleToggle()" aria-label="Toggle Sidebar">
        @if (isMobileOpen$ | async) {
          <!-- Cross Icon -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M6.21967 7.28131C5.92678 6.98841 5.92678 6.51354 6.21967 6.22065C6.51256 5.92775 6.98744 5.92775 7.28033 6.22065L11.999 10.9393L16.7176 6.22078C17.0105 5.92789 17.4854 5.92788 17.7782 6.22078C18.0711 6.51367 18.0711 6.98855 17.7782 7.28144L13.0597 12L17.7782 16.7186C18.0711 17.0115 18.0711 17.4863 17.7782 17.7792C17.4854 18.0721 17.0105 18.0721 16.7176 17.7792L11.999 13.0607L7.28033 17.7794C6.98744 18.0722 6.51256 18.0722 6.21967 17.7794C5.92678 17.4865 5.92678 17.0116 6.21967 16.7187L10.9384 12L6.21967 7.28131Z"
              fill="currentColor" />
          </svg>
        } @else {
          <!-- Hamburger Icon -->
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M0.583252 1C0.583252 0.585788 0.919038 0.25 1.33325 0.25H14.6666C15.0808 0.25 15.4166 0.585786 15.4166 1C15.4166 1.41421 15.0808 1.75 14.6666 1.75L1.33325 1.75C0.919038 1.75 0.583252 1.41422 0.583252 1ZM0.583252 11C0.583252 10.5858 0.919038 10.25 1.33325 10.25L14.6666 10.25C15.0808 10.25 15.4166 10.5858 15.4166 11C15.4166 11.4142 15.0808 11.75 14.6666 11.75L1.33325 11.75C0.919038 11.75 0.583252 11.4142 0.583252 11ZM1.33325 5.25C0.919038 5.25 0.583252 5.58579 0.583252 6C0.583252 6.41421 0.919038 6.75 1.33325 6.75L7.99992 6.75C8.41413 6.75 8.74992 6.41421 8.74992 6C8.74992 5.58579 8.41413 5.25 7.99992 5.25L1.33325 5.25Z"
              fill="currentColor" />
          </svg>
        }
      </button>
      <!-- Logo (placeholder) -->
      <a routerLink="/" class="xl:hidden transition-transform duration-300 hover:scale-105 flex-shrink-0">
        <img class="dark:hidden h-7 w-auto sm:h-8" src="assets/images/logo/logo.png" alt="Logo" />
        <img class="hidden dark:block h-7 w-auto sm:h-8" src="/images/logo/logo-dark.png" alt="Logo" />
      </a>
      <button (click)="toggleApplicationMenu()"
        class="modern-button modern-button-secondary flex items-center justify-center w-9 h-9 text-gray-700 rounded-lg z-99999 dark:text-gray-400 sm:w-10 sm:h-10 sm:rounded-xl md:w-11 md:h-11 xl:hidden transition-all duration-300 hover:scale-105 active:scale-95"
        [ngClass]="{
          'bg-brand-50 border-brand-300 text-brand-600 dark:bg-brand-900/20 dark:border-brand-700 dark:text-brand-400': isApplicationMenuOpen
        }">
        <!-- Dots Icon -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M5.99902 10.4951C6.82745 10.4951 7.49902 11.1667 7.49902 11.9951V12.0051C7.49902 12.8335 6.82745 13.5051 5.99902 13.5051C5.1706 13.5051 4.49902 12.8335 4.49902 12.0051V11.9951C4.49902 11.1667 5.1706 10.4951 5.99902 10.4951ZM17.999 10.4951C18.8275 10.4951 19.499 11.1667 19.499 11.9951V12.0051C19.499 12.8335 18.8275 13.5051 17.999 13.5051C17.1706 13.5051 16.499 12.8335 16.499 12.0051V11.9951C16.499 11.1667 17.1706 10.4951 17.999 10.4951ZM13.499 11.9951C13.499 11.1667 12.8275 10.4951 11.999 10.4951C11.1706 10.4951 10.499 11.1667 10.499 11.9951V12.0051C10.499 12.8335 11.1706 13.5051 11.999 13.5051C12.8275 13.5051 13.499 12.8335 13.499 12.0051V11.9951Z"
            fill="currentColor" />
        </svg>
      </button>
      <!-- Search - Responsive -->
      <div class="hidden lg:block xl:flex-1 xl:max-w-md 2xl:max-w-lg animate-fade-in">
        <form class="w-full">
          <div class="relative group w-full">
            <span class="absolute -translate-y-1/2 pointer-events-none top-1/2 transition-colors duration-300 group-focus-within:text-brand-500"
                  [ngClass]="{
                    'left-3 sm:left-4': !translationService.isRTL,
                    'right-3 sm:right-4': translationService.isRTL
                  }">
              <!-- Search Icon -->
              <svg class="fill-gray-500 dark:fill-gray-400 group-focus-within:fill-brand-500 dark:group-focus-within:fill-brand-400 transition-colors duration-300 w-4 h-4 sm:w-5 sm:h-5" width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M3.04175 9.37363C3.04175 5.87693 5.87711 3.04199 9.37508 3.04199C12.8731 3.04199 15.7084 5.87693 15.7084 9.37363C15.7084 12.8703 12.8731 15.7053 9.37508 15.7053C5.87711 15.7053 3.04175 12.8703 3.04175 9.37363ZM9.37508 1.54199C5.04902 1.54199 1.54175 5.04817 1.54175 9.37363C1.54175 13.6991 5.04902 17.2053 9.37508 17.2053C11.2674 17.2053 13.003 16.5344 14.357 15.4176L17.177 18.238C17.4699 18.5309 17.9448 18.5309 18.2377 18.238C18.5306 17.9451 18.5306 17.4703 18.2377 17.1774L15.418 14.3573C16.5365 13.0033 17.2084 11.2669 17.2084 9.37363C17.2084 5.04817 13.7011 1.54199 9.37508 1.54199Z"
                  fill="currentColor" />
              </svg>
            </span>
            <input #searchInput type="text" [placeholder]="translationService.t('header.search')"
              class="modern-input h-9 w-full rounded-lg border border-gray-200 bg-white/80 backdrop-blur-sm py-2 text-xs sm:text-sm text-gray-800 shadow-theme-sm placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:bg-white dark:border-gray-700 dark:bg-gray-800/80 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-600 dark:focus:ring-brand-500/30 sm:h-10 sm:rounded-xl lg:h-11 xl:w-full 2xl:w-[430px] transition-all duration-300"
              [ngClass]="{
                'pl-9 pr-16 sm:pl-12 sm:pr-20': !translationService.isRTL,
                'pr-9 pl-16 sm:pr-12 sm:pl-20': translationService.isRTL
              }" />
            <button
              class="absolute top-1/2 inline-flex -translate-y-1/2 items-center gap-0.5 sm:gap-1 rounded-md sm:rounded-lg border border-gray-200 bg-gradient-to-br from-gray-50 to-gray-100 px-1.5 py-1 sm:px-2 sm:py-1.5 text-[9px] sm:text-xs font-medium -tracking-[0.2px] text-gray-600 shadow-theme-xs transition-all duration-300 hover:shadow-theme-sm hover:scale-105 active:scale-95 dark:border-gray-700 dark:from-gray-800 dark:to-gray-900 dark:text-gray-300 dark:hover:border-gray-600"
              [ngClass]="{
                'right-2 sm:right-2.5': !translationService.isRTL,
                'left-2 sm:left-2.5': translationService.isRTL
              }"
              type="button"
              title="Cmd+K للبحث">
              <kbd class="text-[8px] sm:text-[10px] hidden sm:inline">⌘</kbd>
              <kbd class="text-[8px] sm:text-[10px]">K</kbd>
            </button>
          </div>
        </form>
      </div>
    </div>
    <div [ngClass]="isApplicationMenuOpen ? 'flex' : 'hidden'"
      class="items-center w-full gap-2 px-3 py-3 sm:gap-3 sm:px-4 sm:py-3.5 md:gap-4 md:px-5 md:py-4 xl:flex xl:px-0 xl:py-0 shadow-theme-md xl:shadow-none bg-white/50 backdrop-blur-sm dark:bg-gray-900/50 xl:bg-transparent animate-fade-in"
      [ngClass]="{
        'justify-between': true,
        'xl:justify-end': !translationService.isRTL,
        'xl:justify-start': translationService.isRTL,
        'flex-row-reverse': translationService.isRTL
      }">
      <div class="flex items-center gap-1.5 sm:gap-2 md:gap-3 flex-wrap"
           [ngClass]="{
             'flex-row-reverse': translationService.isRTL
           }">
        <!-- Language Toggle -->
        <div class="transition-transform duration-300 hover:scale-105 active:scale-95">
          <app-language-toggle />
        </div>
        <!-- ThemeToggleButton placeholder -->
        <div class="transition-transform duration-300 hover:scale-105 active:scale-95">
          <app-theme-toggle-button />
        </div>
        <!-- NotificationDropdown placeholder -->
        <div class="transition-transform duration-300 hover:scale-105 active:scale-95">
          <app-notification-dropdown />
        </div>
      </div>
      <!-- UserDropdown placeholder -->
      <div class="transition-transform duration-300 hover:scale-105 active:scale-95 flex-shrink-0">
        <app-user-dropdown />
      </div>
    </div>
  </div>
</header>
