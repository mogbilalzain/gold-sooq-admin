<div class="min-h-screen bg-luxury-pattern text-[color:var(--color-on-surface)]">
  <app-sidebar></app-sidebar>
  <app-backdrop></app-backdrop>

  <div
    class="min-w-0 transition-[padding] duration-300 ease-in-out"
    [ngClass]="{
      'xl:pl-[280px]': !translationService.isRTL && (isExpanded$ | async),
      'xl:pl-[80px]':  !translationService.isRTL && !(isExpanded$ | async),
      'xl:pr-[280px]':  translationService.isRTL && (isExpanded$ | async),
      'xl:pr-[80px]':   translationService.isRTL && !(isExpanded$ | async)
    }"
  >
    <app-header />
    <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </div>
    <app-footer />
  </div>
</div>
