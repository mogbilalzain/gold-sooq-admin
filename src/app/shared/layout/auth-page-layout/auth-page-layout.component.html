<div class="relative p-6 z-1 sm:p-0 bg-[color:var(--color-surface)] text-[color:var(--color-on-surface)]">
  <div
    class="relative flex flex-col justify-center w-full h-screen lg:flex-row sm:p-0"
  >
    <ng-content></ng-content>
    <div
      class="items-center hidden w-full lg:w-1/2 lg:grid relative overflow-hidden lg:my-4 lg:me-4 lg:h-[calc(100%-2rem)] lg:rounded-m3-xl"
      style="background: linear-gradient(135deg, var(--color-brand-800) 0%, var(--color-brand-950) 100%);"
    >
      <!-- Soft gold ambient glow -->
      <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 rounded-full"
             style="background: radial-gradient(circle, rgba(212, 175, 55, 0.18) 0%, transparent 70%);"></div>
        <div class="absolute bottom-1/4 right-1/4 w-72 h-72 rounded-full"
             style="background: radial-gradient(circle, rgba(233, 195, 73, 0.15) 0%, transparent 70%);"></div>
      </div>

      <div class="flex items-center justify-center z-1 relative">
        <!-- Common Grid Shape -->
        <app-grid-shape />
        <div class="flex flex-col items-center max-w-xs">
          <a routerLink="/" class="block mb-4">
            <img
              width="231"
              height="48"
              src="/images/logo/auth-logo.png"
              alt="Logo"
            />
          </a>
          <p class="text-center text-white/80 leading-relaxed">
            {{ translationService.getTranslations().auth.slogan }}
          </p>
        </div>
      </div>
    </div>
    <div class="fixed z-50 hidden bottom-6 right-6 sm:block">
      <app-theme-toggle-two />
    </div>
  </div>
</div>
